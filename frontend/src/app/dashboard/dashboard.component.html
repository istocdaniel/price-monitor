<head>
  <link href="https://fonts.googleapis.com/css?family=Inter:400,800,900&display=swap" rel="stylesheet">
</head>

<div class="container">
  <nav>
    <h1>Price Monitor</h1>
    <img src="/assets/profile.jpg" alt="profile-pic" id="d">
  </nav>
  <main>
    <p>Welcome back, {{username}}!</p>
    <form class="addProductForm" (submit)="submitProduct()">
      <input type="text" [(ngModel)]="newProductName" name="productName" placeholder="Product name"><br>
      <input type="text" [(ngModel)]="newProductUrl" name="productUrl" placeholder="Product URL"><br>
      <button type="button" (click)="submitProduct()">Add Product</button>
    </form>
  </main>
  <div id="sidebar">
    <a href="/dashboard">Overview</a>
    <a href="/products">Products</a>
    <a href="/alerts">Alerts</a>
  </div>
  <div id="content1">
    <div *ngFor="let product of products.slice(0, 6)" class="product-card">
      <button class="delete-button" (click)="deleteProduct(product.id)">X</button>
      <h3>{{ product.name }}</h3>
    </div>
    <a *ngIf="products.length > 6" href="/products" class="more-link">More</a>
  </div>
  <div id="content2">Content2</div>
  <div id="content3">Content3</div>
  <footer>Footer</footer>
</div>
